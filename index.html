<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPOPIUM — Seoul After Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-tag">FM 001</div>
    <div class="header-brand">KPOPIUM</div>
    <div class="header-status"><span class="dot"></span>ON AIR</div>
  </header>

  <section class="hero">
    <div class="hero-bg" style="background-image:url('assets/scenes/seoul-night.png')"></div>
    <div class="hero-fade"></div>
    <div class="grain"></div>

    <div class="hero-sign hero-sign-left">K-POP · INDIE · NIGHT DRIVE</div>

    <div class="hero-copy">
      <p class="hero-eyebrow">서울 · SEOUL AFTER DARK</p>
      <h1>KPOPIUM</h1>
      <p class="hero-tagline">no love. just vibes.</p>
    </div>

    <div class="player" id="player">
      <div class="player-art" id="player-art">
        <div id="yt-player"></div>
      </div>
      <div class="player-info">
        <p class="player-title" id="player-title">—</p>
        <p class="player-artist" id="player-artist">—</p>
        <div class="player-bar">
          <div class="player-bar-fill" id="player-bar-fill"></div>
        </div>
        <div class="player-time">
          <span id="player-elapsed">0:00</span>
          <span id="player-total">0:00</span>
        </div>
      </div>
      <div class="player-controls">
        <button id="btn-shuffle" class="ctrl-secondary" aria-label="Shuffle" title="Shuffle">🔀</button>
        <button id="btn-prev" aria-label="Previous">⏮</button>
        <button id="btn-play" class="play-button" aria-label="Play">▶</button>
        <button id="btn-next" aria-label="Next">⏭</button>
        <button id="btn-repeat" class="ctrl-secondary" aria-label="Repeat" title="Repeat: off">🔁</button>
      </div>
    </div>

    <div class="scroll-indicator">
      <span>SCROLL</span>
      <span class="scroll-arrow">↓</span>
    </div>
  </section>

  <section class="playlist-section">
    <div class="section-heading">
      <div>
        <p class="section-eyebrow">KPOPIUM PLAYLIST</p>
        <h2>Tracklist</h2>
      </div>
      <span class="track-count" id="track-count">0 tracks</span>
    </div>
    <div class="playlist-list" id="playlist-list"></div>
  </section>

  <section class="queue-section">
    <div class="section-heading">
      <div>
        <p class="section-eyebrow">LATE NIGHTS. LOUD MUSIC.</p>
        <h2>Your Queue</h2>
      </div>
      <span class="queue-count" id="queue-count">0</span>
    </div>
    <div id="queue-body"></div>
  </section>

  <footer class="site-footer">
    <span>KPOPIUM FM · 서울</span>
    <span>DREAM IN PURPLE</span>
  </footer>

  <script src="script.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
